<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStream Workspace - Coding Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #030712; color: #f3f4f6; font-family: system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background-color: #030712; border-bottom: 1px solid #1e293b; }
        .logo { font-size: 22px; font-weight: 900; color: #3b82f6; text-decoration: none; }
        .exit-btn { color: #9ca3af; background: #111827; border: 1px solid #1e293b; padding: 10px 18px; border-radius: 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        
        /* 3-Column Immersive Workspace Grid */
        .workspace-grid { display: grid; grid-template-columns: 1.8fr 1.5fr 1fr; height: calc(100vh - 65px); gap: 16px; padding: 16px; }
        
        /* Column 1: Video Display */
        .video-panel { display: flex; flex-direction: column; background: #070a13; border: 1px solid #1e293b; border-radius: 20px; padding: 16px; justify-content: center; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #111827; }
        video { width: 100%; height: 100%; object-fit: contain; }
        h1 { font-size: 20px; font-weight: 800; color: #fff; margin-top: 16px; }
        
        /* Column 2: Code Editor Sandbox */
        .sandbox-panel { display: flex; flex-direction: column; background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 20px; }
        .sandbox-header { font-size: 14px; font-weight: 800; color: #3b82f6; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        textarea { flex: 1; width: 100%; background: #030712; border: 1px solid #334155; color: #34d399; font-family: monospace; padding: 16px; border-radius: 12px; resize: none; font-size: 14px; outline: none; }
        textarea:focus { border-color: #3b82f6; }
        .sandbox-controls { display: flex; justify-content: space-between; margin-top: 12px; gap: 12px; }
        .run-btn { flex: 1; background: #3b82f6; color: #030712; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .clear-btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .terminal-out { height: 120px; width: 100%; background: #030712; border: 1px solid #1e293b; border-radius: 12px; margin-top: 12px; padding: 12px; font-family: monospace; font-size: 13px; color: #9ca3af; overflow-y: auto; white-space: pre-wrap; }
        
        /* Column 3: Playlist Syllabus */
        .syllabus-panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 20px; overflow-y: auto; }
        .syllabus-panel h2 { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 16px; }
        .track-btn { width: 100%; text-align: left; padding: 14px; background-color: #1e293b; border: 1px solid #334155; color: #ffffff; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .track-btn span { font-size: 9px; font-family: monospace; font-weight: 700; color: #3b82f6; display: block; margin-bottom: 2px; text-transform: uppercase; }
        .track-btn h4 { font-size: 13px; font-weight: 700; }
    </style>
</head>
<body>

    <nav>
        <a href="/dashboard/" class="logo">EDUSTREAM</a>
        <button onclick="window.location.href='/courses/'" class="exit-btn">Catalogue Workspace</button>
    </nav>

    <div class="workspace-grid">
        <!-- 1. Media Stream Deck -->
        <div class="video-panel">
            <div class="video-box"><video id="main-video" controls src=""></video></div>
            <h1 id="lesson-title">Loading track modules...</h1>
        </div>

        <!-- 2. Integrated Code Compiler Sandbox -->
        <div class="sandbox-panel">
            <div class="sandbox-header">JavaScript Playground Environment</div>
            <textarea id="code-editor" placeholder="// Write test script calculations or variable logic metrics here...&#10;let message = 'Hello Developer';&#10;console.log(message);"></textarea>
            <div class="sandbox-controls">
                <button onclick="clearConsole()" class="clear-btn">Reset</button>
                <button onclick="executeSandboxCode()" class="run-btn">Execute Logic &rarr;</button>
            </div>
            <div id="terminal-log" class="terminal-out">> Terminal compiler output channel ready...</div>
        </div>

        <!-- 3. Syllabus Browser Module -->
        <div class="syllabus-panel">
            <h2>Track Modules</h2>
            <div id="playlist"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            const courseId = pathSegments[pathSegments.length - 1];
            fetch(`/api/courses/${courseId}/lessons/`)
                .then(res => res.json())
                .then(lessons => {
                    const playlist = document.getElementById('playlist');
                    if(!lessons || lessons.length === 0) {
                        playlist.innerHTML = '<p style="color:#6b7280;font-size:12px;">Syllabus empty.</p>';
                        return;
                    }
                    playlist.innerHTML = lessons.map((lesson, idx) => `
                        <button onclick="streamTrack(this, '${lesson.video_url}', '${lesson.title.replace(/'/g, "\\'")}')" class="track-btn">
                            <span>Module 0${idx + 1}</span>
                            <h4>${lesson.title}</h4>
                        </button>`).join('');
                    const firstItem = document.querySelector('.track-btn');
                    if (firstItem) streamTrack(firstItem, lessons[0].video_url, lessons[0].title);
                });
        });

        function streamTrack(element, videoUrl, lessonName) {
            document.querySelectorAll('.track-btn').forEach(el => el.style.borderColor = '#334155');
            element.style.borderColor = '#3b82f6';
            const videoPlayer = document.getElementById('main-video');
            videoPlayer.src = videoUrl;
            document.getElementById('lesson-title').innerText = lessonName;
        }

        // Live isolated Sandboxed Script Execution Compiler Logic Channel
        function executeSandboxCode() {
            const code = document.getElementById('code-editor').value;
            const terminal = document.getElementById('terminal-log');
            terminal.innerText = '';
            
            // Intercept console.log statements securely
            let outputLog = [];
            const originalLog = console.log;
            console.log = function(...args) {
                outputLog.push(args.join(' '));
                originalLog.apply(console, args);
            };

            try {
                const closureResult = new Function(code);
                const executionReturn = closureResult();
                
                if (outputLog.length > 0) {
                    terminal.innerText = outputLog.map(line => `> ${line}`).join('\n');
                } else if (executionReturn !== undefined) {
                    terminal.innerText = `> Return value: ${executionReturn}`;
                } else {
                    terminal.innerText = `> Script completed successfully with no console logs outputted.`;
                }
            } catch (error) {
                terminal.style.color = '#f87171';
                terminal.innerText = `> Operational Compilation Error:\n  ${error.message}`;
            }
            console.log = originalLog; // Restore console behavior tracking parameters
        }

        function clearConsole() {
            document.getElementById('terminal-log').style.color = '#9ca3af';
            document.getElementById('terminal-log').innerText = '> Console buffer cleared.';
            document.getElementById('code-editor').value = '';
        }
    </script>
</body>
</html>
