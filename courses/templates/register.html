<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELearn - New User Registration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #030712; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .register-card { background-color: #0f172a; border: 1px solid #1e293b; width: 100%; max-width: 420px; border-radius: 32px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .header-title { font-size: 24px; font-weight: 900; color: #3b82f6; text-align: center; margin-bottom: 4px; }
        .header-sub { font-size: 12px; text-transform: uppercase; color: #9ca3af; text-align: center; margin-bottom: 32px; font-weight: 700; letter-spacing: 0.5px; }
        .alert-box { background-color: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 12px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; margin-bottom: 8px; }
        input { width: 100%; background-color: #030712; border: 1px solid #334155; color: #ffffff; padding: 14px; border-radius: 16px; font-size: 14px; outline: none; }
        input:focus { border-color: #3b82f6; }
        .submit-btn { width: 100%; background-color: #3b82f6; color: #030712; border: none; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; padding: 16px; border-radius: 16px; cursor: pointer; transition: background-color 0.2s; }
        .submit-btn:hover { background-color: #60a5fa; }
        .footer-text { text-align: center; margin-top: 32px; border-top: 1px solid #1e293b; padding-top: 24px; font-size: 12px; color: #6b7280; }
        .footer-text a { color: #3b82f6; font-weight: 500; text-decoration: none; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="header-title">ELearn</div>
        <div class="header-sub">Create New User</div>
        
        {% if messages %}
            <div class="alert-box">
                {% for message in messages %}{{ message }}{% endfor %}
            </div>
        {% endif %}
        
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Register Account</button>
        </form>
        <div class="footer-text">Already have an account? <a href="{% url 'login' %}">Sign in &rarr;</a></div>
    </div>
</body>
</html>
